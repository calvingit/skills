<!doctype html>
<html lang="zh-CN" data-layout="@@LAYOUT@@" data-toc="@@TOC_ENABLED@@" data-cards="@@CARDS@@"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title><style>
:root{--bg:#f4f2e9;--paper:#fffef8;--ink:#292f27;--muted:#646b60;--line:#dedfd1;--accent:#4d6340;--soft:#eef1e4;--warn:#9a583a;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #819367;outline-offset:3px}a{color:var(--accent)}button{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);padding:8px 15px}button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.shell{max-width:1440px;margin:auto;padding:34px 40px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px}.controls{display:flex;flex-wrap:wrap;gap:8px}.hero{max-width:900px;padding:30px 0 24px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.08em;margin:0 0 8px}h1{font-size:clamp(26px,3vw,39px);letter-spacing:-.03em;line-height:1.25;margin:0 0 15px;font-weight:650}.lead{font-size:17px;color:var(--muted);margin:0;max-width:800px}.status{display:inline-block;margin-top:14px;font-size:12px;color:var(--warn);border:1px solid #dfc4b1;border-radius:5px;padding:2px 8px}.layout-note{color:var(--muted);font-size:13px;margin:0 0 22px}.workspace{display:block}.toc{display:none}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;scroll-margin-top:20px}.panel.wide{grid-column:span 2}.panel.full{grid-column:1 / -1}.panel-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 18px}.number{font:11px/1.5 ui-monospace,monospace;color:var(--accent);background:var(--soft);padding:3px 7px;border-radius:4px}h2{font-size:16px;line-height:1.4;margin:0;font-weight:650}.panel-body{padding:18px 20px}.panel-body p{margin:0 0 12px}.panel-body p:last-child{margin-bottom:0}.verdict{border-left:4px solid var(--accent)}.callout{margin-bottom:12px}.callout:last-child{margin-bottom:0}.callout>p:first-child{font-size:19px;line-height:1.55;font-weight:600}.small{font-size:13px;color:var(--muted)}ul{padding-left:18px;margin:0}li+li{margin-top:9px}.table-scroll,.diagram-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:285px}th,td{text-align:left;vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted)}tbody tr:last-child td{border:0}.diagram-scroll{padding:4px 0}.diagram-scroll svg{display:block;width:100%;max-width:700px;min-width:300px;height:auto;margin:auto}.diagram-note{font-size:12px;color:var(--muted);margin-top:8px!important}.checks{display:flex;flex-direction:column;gap:12px;margin:0 0 18px}.checks label{display:flex;align-items:center;gap:10px;cursor:pointer}.checks input{width:17px;height:17px;accent-color:var(--accent)}.result{border:1px solid #d3dcc4;background:var(--soft);border-radius:8px;padding:14px 16px}.result strong{display:block;color:var(--accent);margin-bottom:4px}.result p{font-size:13px;margin:0}
html[data-layout="doc"] .shell{max-width:1180px}html[data-layout="doc"] .workspace{display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px}html[data-layout="doc"] .toc{display:block;position:sticky;top:24px;align-self:start;font-size:13px;padding:10px 0}html[data-layout="doc"] .toc a{display:block;text-decoration:none;color:var(--muted);padding:6px 0 6px 12px;border-left:2px solid var(--line)}html[data-layout="doc"] .toc a:hover{color:var(--accent);border-color:var(--accent)}html[data-layout="doc"] .panels{display:block}html[data-layout="doc"] .panel{margin-bottom:22px}html[data-layout="doc"] .panel:last-child{margin-bottom:0}html[data-layout="doc"] .panel-body{padding:22px 26px}html[data-layout="doc"] .verdict{background:var(--soft)}
@media(max-width:1100px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.panel.wide{grid-column:span 2}.panel.full{grid-column:1 / -1}.shell{padding:26px}.top{align-items:flex-start}.controls{justify-content:flex-end}}
@media(max-width:760px){.shell{padding:20px 16px 28px}.top{display:block;padding-bottom:16px}.controls{margin-top:12px;justify-content:flex-start}button{padding:7px 11px;font-size:13px}.hero{padding:23px 0 20px}.lead{font-size:15px}.panels{grid-template-columns:minmax(0,1fr);gap:15px}.panel.wide{grid-column:auto}.panel-body,html[data-layout="doc"] .panel-body{padding:16px}.panel-head{padding:12px 15px}.callout>p:first-child{font-size:17px}html[data-layout="doc"] .workspace{display:block}html[data-layout="doc"] .toc{position:static;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}html[data-layout="doc"] .toc a{border:0;background:var(--soft);padding:4px 9px;border-radius:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{body{background:white}.shell{padding:0}.controls,.layout-note,.toc{display:none!important}.workspace,.panels{display:block!important}.panel{break-inside:avoid;margin-bottom:16px}}

html[data-layout="doc"][data-toc="false"] .workspace{display:block}
html[data-cards="false"] .panel{background:transparent;border:0;border-radius:0;overflow:visible}
html[data-cards="false"] .panel-head{border:0;padding:10px 0}
html[data-cards="false"] .panel-body{padding:10px 0}
html[data-cards="false"] .verdict{border-left:3px solid var(--accent);padding-left:18px;background:transparent}
</style></head>
<body><main class="shell">
<header class="top"><div class="controls" role="group" aria-label="版式选择"><button type="button" id="sheet-button" aria-pressed="@@SHEET_PRESSED@@">总览 · sheet</button><button type="button" id="doc-button" aria-pressed="@@DOC_PRESSED@@">讲解 · doc</button><button type="button" id="copy-button">复制内容稿</button></div></header>
<div class="hero"><p class="eyebrow">@@SUBTITLE@@</p><h1>@@TITLE@@</h1><p class="lead">@@SUMMARY@@</p>@@STATUS@@</div>
<p class="layout-note" id="layout-note"></p><div class="workspace">@@TOC@@<div class="panels">@@PANELS@@</div></div>
</main>
<script type="application/json" id="content-source">@@SOURCE@@</script>
<script>const sheetButton=document.getElementById('sheet-button');
const docButton=document.getElementById('doc-button');
function setLayout(mode){document.documentElement.dataset.layout=mode;sheetButton.setAttribute('aria-pressed',String(mode==='sheet'));docButton.setAttribute('aria-pressed',String(mode==='doc'));document.getElementById('layout-note').textContent=mode==='sheet'?'总览：并列查看相关内容；重要图示可跨列显示。':'讲解：按内容顺序连续阅读。';}
sheetButton.addEventListener('click',()=>setLayout('sheet'));
docButton.addEventListener('click',()=>setLayout('doc'));
document.getElementById('copy-button').addEventListener('click',async function(){const text=JSON.stringify(JSON.parse(document.getElementById('content-source').textContent),null,2);try{await navigator.clipboard.writeText(text);this.textContent='内容稿已复制';}catch{this.textContent='无法自动复制';const pre=document.createElement('pre');pre.textContent=text;pre.style.cssText='white-space:pre-wrap;padding:20px;border:1px solid #dedfd1';if(!document.getElementById('source-fallback')){pre.id='source-fallback';document.querySelector('main').append(pre);}}});

setLayout(document.documentElement.dataset.layout);
</script>
@@CUSTOM_SCRIPT@@
</body></html>
